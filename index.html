<script>
    window.history.replaceState(null, "", "/");

    document.addEventListener("click", function (event) {

        const link = event.target.closest("a");

        if (!link) {
            return;
        }

        const href = link.getAttribute("href");

        if (!href) {
            return;
        }

        if (
            href === "products.html" ||
            href === "categories.html" ||
            href === "about.html" ||
            href === "contact.html" ||
            href === "index.html"
        ) {
            event.preventDefault();

            let page;

            if (href === "products.html") {
                page = "/lyratech_frontend/products.html";
            }

            else if (href === "categories.html") {
                page = "/lyratech_frontend/categories.html";
            }

            else if (href === "about.html") {
                page = "/lyratech_frontend/about.html";
            }

            else if (href === "contact.html") {
                page = "/lyratech_frontend/contact.html";
            }

            else {
                page = "/lyratech_frontend/index.html";
            }

            window.location.href = page;
        }

    });
</script>
